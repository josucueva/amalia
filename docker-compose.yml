services:
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-ollama
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agentic-network

  mongodb:
    image: mongo:7
    container_name: agentic-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: amalia
    networks:
      - agentic-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/amalia --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
      - ./config/agents:/app/config/agents
      - ./backend/mcp_servers:/app/mcp_servers
      - ./backend/mcp_servers_config.json:/app/mcp_servers_config.json
      - ./data:/app/data
      - app_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local

networks:
  agentic-network:
    driver: bridge

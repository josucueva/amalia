services:
  # MongoDB for persistence
  mongodb:
    image: mongo:7
    container_name: agentic-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: amalia
    networks:
      - agentic-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/amalia --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for message queue
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - agentic-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Mount host config directory (read agents from host, write to both host and MongoDB)
      - ./config/agents:/app/config/agents
      # Mount MCP servers directory for Python MCP servers
      - ./backend/mcp_servers:/app/mcp_servers
      # Mount MCP servers config
      - ./backend/mcp_servers_config.json:/app/mcp_servers_config.json
      # Persistent volumes for data
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agentic-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local

networks:
  agentic-network:
    driver: bridge
